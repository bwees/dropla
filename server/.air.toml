root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/app ."
entrypoint = "./tmp/app"
include_ext = ["go"]
# data holds the SQLite file and every uploaded blob. Watching it makes the
# reloader churn on uploads, downloads and deletes — and with the WAL journal it
# changes constantly.
exclude_dir = ["tmp", "data"]
exclude_regex = ["_test\\.go"]
stop_on_error = true
delay = 500

[log]
time = true

[misc]
clean_on_exit = true
