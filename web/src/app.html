<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Applied before first paint so a dark-mode user never sees a white flash.
			// Kept in sync with src/lib/theme.svelte.ts.
			try {
				const stored = localStorage.getItem('dropla-theme');
				const dark =
					stored === 'dark' ||
					((stored === 'system' || !stored) &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			} catch {
				// localStorage unavailable — fall back to the light default.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
